      <h1>Palash Ranjan Roy (Palash Roy)</h1>
      <p>
        <strong>Palash Ranjan Roy</strong> (also known as <strong>Palash Roy</strong>,
        <strong>Ranjan Roy</strong>, or <strong>P. R. Roy</strong>) is a Computer Science PhD
        researcher and code clone researcher at the <a href="https://www.usask.ca/">University of Saskatchewan</a>
        in Saskatoon, Canada. His research focuses on code clone detection, refactoring, and the
        application of large language models (LLMs) to software engineering. Originally from
        Bangladesh, Palash completed his undergraduate studies at BRAC University before moving to
        Canada for graduate studies. He is a member of the Software Research Lab (SRLab) and the
        Interactive Software Engineering Lab (ISELab). In university governance, Palash served as
        President of the University of Saskatchewan Graduate Students' Association (GSA, 2025-2026),
        as a member of the University Senate, and on the Provost and Vice-President Academic Search
        Committee.
      </p>

      <h2>Selected Publications by Palash Ranjan Roy</h2>
      <ul>
        <li>A. I. Alam, P. R. Roy, C. K. Roy, B. Roy, K. A. Schneider. "Carbon-Taxed Transformers: A Green Compression Pipeline for Overgrown Language Models." Proceedings of the ACM on Software Engineering (PACMSE), FSE 2026. <a href="https://arxiv.org/abs/2604.25903">arXiv:2604.25903</a></li>
        <li>A. I. Alam, P. R. Roy, F. Al-omari, C. K. Roy, B. Roy, K. A. Schneider. "Are Classical Clone Detectors Good Enough For the AI Era?" ICSME 2025. <a href="https://arxiv.org/abs/2509.25754">arXiv:2509.25754</a></li>
        <li>P. R. Roy. "Towards Just-In-Time, Inclusive Clone Refactoring." ICSME 2025. <a href="/papers/Towards_Just-In-Time_Inclusive_Clone_Refactoring.pdf">PDF</a></li>
        <li>P. R. Roy, M. Billah, Z. Codabux, B. Roy. "Are Large Language Models a Threat to Programming Platforms? An Exploratory Study." ESEM 2024.</li>
        <li>A. I. Alam, P. R. Roy, F. Al-Omari, C. K. Roy, B. Roy, K. A. Schneider. "GPTCloneBench: A comprehensive benchmark of semantic clones and cross-language clones using GPT-3 and SemanticCloneBench." ICSME 2023.</li>
        <li>P. R. Roy, A. I. Alam, F. Al-omari, B. Roy, C. K. Roy, K. A. Schneider. "Unveiling the potential of large language models in generating semantic and cross-language clones." IWSC 2023.</li>
        <li>P. R. Roy, M. N. Islam, L. T. Jeba, et al. "A study on paper and author ranking." ICISET 2022.</li>
      </ul>
